# dart_vision 配置文件
#
# 顶层 host / port 是 simulator_system 图像流的地址，sim_receiver 会直接读取，
# 保持与原工程一致（不要删除这两行）。
host: "10.117.214.138"
port: 7666

# ============ 图像源 ============
source:
  mode: tcp              # tcp = 接入 simulator_system；video = 离线回放录像
  video_path: "record_20260919_161539.mp4"
  loop: true             # 离线回放时循环播放
  realtime: true         # 离线回放时按原帧率播放，false = 全速跑

# ============ 回发通道（对应 main_final.py 的 send_blob_uart） ============
command:
  enabled: true
  host: ""               # 留空则使用顶层 host
  port: 7667             # simulator_system 的文本指令端口
  # dart_servo : 【推荐 / 当前架构】回发 DART <pitch> <yaw> <roll>（弧度）。
  #              仿真器只执行舵角，不解释视线角——制导律在视觉端（见 control 段）。
  # szu_uart   : 7 字节二进制帧 0xFF + x/y(大端各 2B) + w/h(各 1B)，与深圳大学开源视觉一致。
  #              仿真器会把它当成"像素框线性映射到舵角"，不是制导律。
  # text_angle : 【已废弃】可读文本 AIM <axis> <yaw> <pitch>。
  #              解耦后仿真器不再解释视线角，AIM 报文会被直接忽略。
  # sim_gimbal : simulator_system 文本指令 GIMBAL <yaw> <pitch>（弧度，右正/上正），手动调试用。
  protocol: dart_servo
  text_verbose: false    # text_angle 协议是否附带距离/像素字段
  max_rate_hz: 60.0      # 回发限频
  reconnect_ms: 500      # 断线重连间隔

# ============ 相机内参 ============
# guided_dart 场景的飞镖第一人称相机是水平 120° FOV、640x480。
# 若之后改用其它相机/分辨率，改这里即可，解算全部依赖该内参。
camera:
  width: 640
  height: 480
  fov_deg: 77.0
  fov_axis: vertical
  fx: 0.0                # 非 0 时直接使用显式内参，忽略 fov
  fy: 0.0
  cx: 0.0                # 0 = 自动取 width/2
  cy: 0.0                # 0 = 自动取 height/2

# ============ 检测（对应 main_final.py 的 find_max_blob / THRESHOLDS1） ============
detector:
  # OpenMV Lab 阈值语义：[(L_min,L_max,A_min,A_max,B_min,B_max)]，可写多组。
  # 深圳大学开源值 = 检测地面基地上的绿色导向灯。
  thresholds:
    - [9, 100, -102, -25, 0, 127]
  min_area_px: 2         # OpenMV blob.pixels() 语义：像素个数，不是轮廓面积
  max_area_px: 0         # 0 = 不限制（导向灯占满画面时可用于剔除）
  blur_kernel: 0         # 0 = 关闭；>0 为高斯核边长
  open_kernel: 0         # 0 = 关闭；开运算，去噪点
  close_kernel: 0        # 0 = 关闭；闭运算，补空洞

# ============ ROI 追踪 / 两阶段变焦（对应 cur_roi + READOUT_ROI 两阶段逻辑） ============
tracker:
  armed: true            # 是否上电即开始检测（对应 wait_for_uart_trigger 后的状态）
  start_delay_ms: 80     # 对应 T_START：起步后多久才开始检测
  found_range_x: 40      # 对应 FOUND_RANGE_X：命中后 ROI 左右外扩
  found_range_y: 40      # 对应 FOUND_RANGE_Y
  lost_reset_frames: 3   # 连续丢失多少帧后 ROI 回到整个画面
  zoom_enable: true      # 对应第二阶段 IOCTL_SET_READOUT_WINDOW（这里用数字变焦等效）
  zoom_after_ms: 900     # 对应 RECORD_TIME：第一阶段时长
  zoom_factor: 4.0       # 处理窗放大倍数，越大导向灯像素越多
  zoom_lost_frames: 2    # 变焦窗口内连续丢失多少帧后退回整幅搜索

# ============ 解算（对应主控板上的 PnP/角度解算，这里前移到视觉端） ============
solver:
  axis: both             # both | yaw | pitch，对应串口 0x11/0x22 的 yaw/pitch 模式
  light_diameter_m: 0.10 # 导向灯直径（simulator: guide_light.radius=0.05 -> 0.10），0 = 不测距
  rate_window: 8         # 角速度估计窗口（帧）
  predict_horizon_ms: 0  # >0 时输出提前量预测角度，0 = 关闭
  rate_reset_gap_ms: 200 # 与上一帧间隔超过该值就清空角速度历史（重新捕获目标后防假值）
  rate_min_samples: 3    # 少于该样本数时角速度输出 0
  rate_limit_dps: 90.0   # 角速度输出限幅，抑制发射瞬间的假值（0 = 不限）

# ============ 制导律（旧链路，已废弃） ============
# 注意：以下 guidance 段是"视觉端只发角度、由仿真器做 PN"的旧链路。
# 仿真器已按"只管物理"的原则删掉了全部控制律，AIM 报文不再被解释，
# 所以这一段现在只在「control.enabled = false 且要用离线回放做角度对照」时有参考价值。
# 真正在用的是下面的 control 段。
# cmd = k_heading * 视线角误差 + k_rate * 视线角速度 + bias，再按死区去抖、按 max_cmd 限幅
# 注意：只在 text_angle / sim_gimbal 这两个「角度域」协议下生效；
#       szu_uart 是写实像素框协议（原样交给主控换算），制导律不会介入。
guidance:
  enabled: false         # 保持 false：解耦架构下由 control 段接管
  mode: pn               # pn = 比例导引（与仿真器 [navigation] 等价，推荐）
                         # pursuit = 纯追踪（把目标压到光轴，会压平弹道，仅作对照）
  # ---- pn 模式：与 guided_dart/config/simulator.toml 的 [navigation] 对应 ----
  pn_gain: 4.0           # 旧仿真器 [navigation] constant（该段已删除，此处仅作对照）
  closing_speed_mps: 18.0    # 接近速度估计（仿真里 close_speed 约 18 m/s）
  lateral_accel_limit: 34.0  # navigation.max_lateral_accel (m/s^2)
  gravity_turn_comp: true    # 机体系->惯性系：减去弹道低头率 γ̇≈-g/V（只作用于 pitch）
  gravity_mps2: 9.81
  arm_delay_ms: 150.0        # 目标（重新）出现后的稳定期，期间不下发制导动作
  arm_on_motion_deg: 3.0     # 视线角偏离"捕获值"超过该值才认为镖在动（发射判定）
  # ---- pursuit 模式的增益（mode: pursuit 时使用）----
  k_heading: 0.0         # 比例增益：目标偏 1° -> 打 1° 舵
  k_rate: 0.0            # 阻尼/提前量（秒）：等效提前时间 = k_rate / k_heading
  # ---- 两种模式共用 ----
  max_cmd_deg: 20.0      # 指令限幅，应与仿真器 [servo] max_angle_deg 一致
  deadband_deg: 0.0      # 死区，末端抑制抖动，可试 0.3
  bias_yaw_deg: 0.0      # 常值偏置（安装误差/瞄点修正）
  bias_pitch_deg: 0.0    # 例：导向灯比靶面低 0.07m，10m 处约需 +0.4°

# ============ 录像（沿用原工程的独立录制线程） ============
record:
  enabled: false
  fps: 30.0
  width: 640
  height: 480

# ============ 控制律（解耦架构：仿真只管物理，控制与坐标变换在这里） ============
# 仿真器侧已无任何控制律（simulator_system 的 [navigation] 段已删除），
# 所以这里是闭环唯一的调参入口，回发 DART <pitch> <yaw> <roll>（弧度）。
# 仿真器会通过同一条指令连接回推 STATE 报文（位置/速度/姿态），控制律用它把
# 机体系视线角转成世界系、算惯性系 λ̇，再旋转回机体系输出三轴舵角。
control:
  enabled: true          # true = 本工程算舵角并回发 DART 报文（当前架构）
  # ---- 第一轮对照实验（2026-09-20）：降带宽、堵噪声 ----
  # 这一轮 flight_log 显示：11 发在靶面前 8m 处散布仅 4cm，到 1m 处涨到 27cm，
  # 即偏差是**终端闭环注入**的，而舵面峰值只有 0.78（未饱和）。
  # 30fps、2~5px 的导向灯，视线角量化 0.31°/px，一帧的 λ̇ 噪声就能顶出 2 m/s² 需求，
  # 比平均修正量还大。所以先降增益 + 加滤波，把散布压下去再谈舵效。
  # N：a_cmd = N·Vc·λ̇
  #
  # 曾经为了压 λ̇ 噪声从 1.0 降到 0.45。但那个噪声源已经解决：
  #   ① 视线角改用亚像素质心（不再是整型包围盒中心的 0.5px 量化）
  #   ② 交战门限改用发射后计时（介入点每发一致）
  # 现在靶面前 4m 处的标准差只有 0.002m，噪声已经不是约束。
  #
  # 而 0.45 的代价很大：制导律里**横向没有位置反馈**（aim_offset 的偏移向量
  # 是 (0, up, fwd)，没有横向分量），横向只能靠 PN 的 λ̇ 项。
  # 实测靶静止时镖仍带着 1.5m/s 横向速度飘过靶面、横向误差 -0.18~+0.49m
  # —— 这就是"yaw 完全跟不上"。
  # 所以把 N 加回去。1.5~2.0 是常规比例导引的取值范围。
  # 仿真器侧把 mixing_gain 0.5→1.0，可用权限翻倍（正是为了补 0.586m 下坠）。
  # 但权限 × 控制器增益 = 回路增益：单独提权限会让回路发散
  # （实测落点分裂到 -1.3m/-0.2m 两簇，和提 control_authority 时同样的失稳特征）。
  # 所以这里把控制器增益按同样比例收回来，只放大"可用权限"、不动回路增益。
  pn_gain: 0.0
  # 常值竖直偏置，直接加在世界系 +Y 上：**正值 = 向上，负值 = 向下**。
  # （control.cpp 的实现是 accel += Vec3(0, bias, 0)，早期注释写反了。）
  #
  # 为什么要用它：加上 engage_ramp 之后，门限开启瞬间的低头冲击被摊平，
  # 落点散布从 σ≈0.05m 降到 0.028m、15 发过靶时刻全是 1.91s，非常可重复；
  # 但那个冲击原本贡献了约 -0.32m 的落点，去掉之后整体抬高，
  # 15 发全部从靶心上方 +0.32m 飞过（0 命中）。
  # 用常值偏置把这一档补回来：它是直流项、不引入抖动的，
  # 和斜坡正好互补——斜坡管"抖动"，偏置管"均值"。
  #
  # 下面 -1.0 是**标定点**，不是最终值：先跑一轮量出落点变化，再按线性解出来，
  # 见 docs/guidance_tuning.md「用两轮数据反解偏置」。
  # 反解：窗口（靶面前 1m 处）≈ [0.775, 0.841]、中心 0.808；
  # 灵敏度 k = 0.137 m 每 (m/s²)。
  #   b = -1.0 实测 0.944（含精度修复）→ 需要再降 0.136 m → Δb = -0.99 → b* = -2.0
  # ⚠ 这个偏置和 yaw **共用同一组舵面的权限**：终端 14m/s 时满舵可用只有
  # ~4.0 m/s²，偏置吃掉多少，yaw 就少多少。实测横向误差随偏置单调变差
  # （-1.0 时 dx∈[-0.12,+0.15]，-3.1 时 dx∈[-0.31,+0.35]）——"yaw 跟不上"
  # 就是这么来的。所以偏置压到 -1.0，垂直偏差改用瞄点（不与 yaw 抢权限的那部分）。
  # 调到此处的落点偏低 0.107m，而瞄点在这个工作点已经不敏感
  # （0.00 与 -0.05 只差 0.004m），所以回到 0.0 —— 顺带把剩下的
  # 权限全部让给 yaw（b=-1.0 时终端 4.0 m/s² 的预算里它占 25%）。
  # 校炮（发射仰角 35.0°→35.5°）后制导不再需要"补下坠"，权限释放，
  # 这个偏置重新变得有效（之前调它没反应就是被饱和吃掉了）。
  # 残余机头偏差 -0.021m，灵敏度 ≈0.12 m/(m/s²) → +0.17。
  accel_bias_mps2: 0.2
  # 瞄点误差项的系数是 2Vc²/R，近距离按 1/R² 放大，权限变大后最容易造成发散，
  # 所以比 pn_gain 收得更狠一些。
  aim_error_gain: 0.0    # 老的"灯→靶心"几何偏角项（固定 <0.3°，无位置信息），已由 zem_gain 取代
  # 零控脱靶量位置反馈：a = zem_gain·2Vc²/R·sin(速度 与 到瞄点视线 的夹角)。
  # 1.0 = 最小时间解；这是"yaw 跟不上 / 竖向调不动"的正面解药。
  zem_gain: 0.6
  # 参考速度下可用侧向加速度。**只在仿真器没有回推该值时兜底**——
  # 现在的 STATE 报文末尾会带上真实值，改仿真器 [aero] 舵效后这里不用跟着改。
  # 注意它是"指令满量程"（分母）：填大了所有舵角会等比缩小，不是"限幅"。
  availability_mps2: 6.7 # 18 m/s 时约 6.7
  reference_speed_mps: 18.0
  max_fin_deg: 20.0      # 与仿真器 [servo] max_angle_deg 一致
  engage_range_m: 8.0    # >0：距离大于该值时舵面中立（纯弹道），进入后才制导
  min_range_m: 1.5
  # 单目测距用（导向灯直径）。**必须 = 2× simulator.toml 的 guide_light.radius**：
  # R = D·fx/像素数，D 与表观像素同比缩放，算出来的距离才不变。
  # 真机换成实际灯尺寸时，这里跟着灯改，瞄点与 ZEM 的 T 都会自动随之校正。
  light_diameter_m: 0.10
  focal_px: 301.72
  # 靶面中心相对导向灯的竖直偏移（灯→靶心的几何换算）。
  #
  #   0.07  = 物理几何真值（simulator.toml [base.guide_light] local_offset 的 -0.07）
  #   +0.042 = 校靶余量：补 35.5°/17.661 m/s 这条弹道的残余偏差
  #
  # 为什么现在能按几何用：制导律已换成含重力的 ZEM，瞄点是**位置量**，
  # 灵敏度实测≈1:1（不会再被 2Vc²/R² 或饱和放大）。旧配置里的负值
  # （-0.05 / -1.0 那一套）是弱 PN 律 + 权限饱和时代的补偿，全部作废。
  #
  # 换发射角/初速/配重后重新校靶：跑一轮 15 发，取 `grep 命中几何` 里 Δy 的均值 m，
  # 然后 aim_offset_up_m += −m。详见 docs/guidance_tuning.md 第 7.5 节。
  aim_offset_up_m: 0.140
  aim_offset_forward_m: 0.10
  # λ̇ 低通时间常数。30fps 下 dt≈0.033s，τ=0.03 时 alpha=0.52 —— 几乎不过滤，
  # τ=0.12 时 alpha=0.22，噪声约降到一半。这是本轮改动的重点。
  rate_filter_secs: 0.12
  max_sample_jump_deg: 3.0
  # 交战门限打开后的指令斜坡时长（秒，0 = 关闭 = 直接阶跃）。
  # 实测门限开启时刻在每发之间会差 0.18~0.22s（≈2.2~2.6m 的介入点差异），
  # 因为门限用的是 2~5px 导向灯反推的单目距离，那一档 1 个像素就是 20~25% 的距离。
  # 阶跃时刻抖动 × 阶跃幅度 = 落点抖动，用斜坡把它摊开。
  # 注意它只软化"介入瞬间"，不会缩小末端权限（这点比降 pn_gain 划算）。
  engage_ramp_secs: 0.25
  # 交战门限改用"发射后计时"（秒，>0 生效；0 = 关闭，仍用 engage_range_m）。
  #
  # 为什么：单目测距来自 2~6px 的导向灯，逐发表观尺寸差 ±25%，
  # 导致"距离降到 8m"这件事每发发生在不同的真实距离上（实测 9.3~12.3m，
  # 开启时刻差 0.16s）。而常值偏置是按交战时长积分的，时长差 0.16s
  # 就会让落点在轮次间漂移 ~0.17m —— 和靶面容差同量级，
  # 表现就是"有时候全中、有时候一个都不中"。
  # 弹道在时间上高度可重复（15 发在靶面前 8m 处只差 1mm），
  # 所以按时间开门能让每发介入点几乎完全一致。
  # 1.40 ≈ 原来的平均开启时刻，可先沿用再微调。
  # 纯弹道实测：镖在靶面处低 0.586m，制导必须一路把它抬上来，
  # 而终端 14m/s 时满舵只有 ~3.4m/s²，抬 0.59m 就需要 ~4.5m/s²
  # —— 权限全被"补下坠"吃掉，yaw 自然跟不上。这是同一个根因。
  # 权限 ∝ v²，所以把介入点提前（速度更高、抬升时间更长）能同时缓解两者。
  engage_after_launch_secs: 1.40
  # 滚转稳定增益（0 = 关闭 = 旧的"从不下发 roll"）。
  #
  # 解耦时仿真器把内部滚转稳定律一起删了，视觉端又一直写 roll = 0，
  # 实测镖在末端自由滚转 ±22°~35°（跨度 57°，15 发完全一致）。
  # 滚转一漂，机体系的 pitch/yaw 相对世界竖直就跟着转：
  # 竖直修正效率随滚转角变、横向与竖直互相串 —— 这就是"yaw 跟不上、
  # 竖直旋钮调不动、同配置两轮差 4~20cm"的直接原因。
  #
  # 仿真器侧需要 [aero] fin_torque_scale > 0，roll 通道才有物理权限。
  # 符号不对（越稳越歪、滚转发散）就改成负值。
  roll_gain: 0.0
  # 静开环标定（非零时绕过制导律直接下发固定舵角，单位：度）
  pitch_open_loop_deg: 0.0
  yaw_open_loop_deg: 0.0
  roll_open_loop_deg: 0.0
  # 相机是否固连在镖头。必须与仿真器 [camera] align_to_velocity 相反取值：
  #   align_to_velocity = false（固连）→ 这里 true
  #   align_to_velocity = true （随速度转）→ 这里 false
  camera_body_fixed: true
  # 单目测距可信所需的最小导向灯像素。低于它就跳过"灯→靶心"换算与瞄点误差反馈
  # （两项都以距离为分母，2px 反推 18.5m、3px 反推 12.3m，±25% 抖动直接进落点）。
  # 4.0 ≈ 9m 处才会启用，正好在交战门限之内。
  range_min_blob_px: 4.0
  # 机头前伸量：机体系 -Z 方向、质心到机头尖的距离（= 碰撞盒半长 0.1173）。
  # >0 时瞄点回退这个矢量，使**机头**落在靶面上（而不是质心命中、机头还悬在靶面前方）。
  # 0 = 关闭（旧行为：质心导向瞄点，机头前上方触不到靶面）。
